name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- src tests vitest.config.mts

      - name: Static analysis
        run: npm run check -- src tests vitest.config.mts package.json --formatter-enabled=false --assist-enabled=false --diagnostic-level=error

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
